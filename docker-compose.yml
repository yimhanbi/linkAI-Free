version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: api-container
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      # Qdrant와 Ollama 주소는 backend/.env에서 
      # http://166.104.246.232:6333 등으로 설정되어 있어야 합니다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - service-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # [수정] localhost 대신 서버의 실제 IP를 적어야 합니다. 
        - VITE_BACKEND_URL=http://localhost:3001
    container_name: web-container
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - service-net

networks:
  service-net:
    driver: bridge
